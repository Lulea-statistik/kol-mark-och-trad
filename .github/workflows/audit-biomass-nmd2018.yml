name: Audit SGD2 biomass vs NMD2018 Norrbotten
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster dependencies
        run: pip install -r requirements.txt 'matplotlib>=3.8'
      - name: Test iterative masks and overlap using synthetic source cells
        run: python -m unittest scripts/test_nmd_quality_scenarios.py
      - name: Download verified NMD2018 Norrbotten and cross-tab original SGD2
        run: python scripts/run_nmd2018_lulea_qa.py
      - name: Render conflict density overview and conservative water QA report
        run: python scripts/render_nmd2018_conflict_report.py
      - name: Render incremental scenario report and sensitivity chart
        run: python scripts/render_nmd2018_quality_steps.py
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgd2-nmd2018-lulea-audit
          path: |
            metadata/nmd2018_biomass_lulea_audit.json
            metadata/nmd2018_conflict_report.md
            metadata/nmd2018_conflict_overview.png
            metadata/nmd2018_quality_steps.md
            metadata/nmd2018_quality_steps.png
          if-no-files-found: warn
          retention-days: 30
