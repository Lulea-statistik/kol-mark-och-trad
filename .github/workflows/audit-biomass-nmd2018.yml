name: Audit SGD2 biomass vs NMD2018 Norrbotten
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster dependencies
        run: pip install -r requirements.txt 'matplotlib>=3.8'
      - name: Test iterative masks and overlap using synthetic source cells
        run: python -m unittest scripts/test_nmd_quality_scenarios.py scripts/test_biomass_plausibility_rules.py scripts/test_biomass_stratified_sampler.py
      - name: Download verified NMD2018 Norrbotten and cross-tab original SGD2
        run: python scripts/run_nmd2018_lulea_qa.py
      - name: Render conflict density overview and conservative water QA report
        run: python scripts/render_nmd2018_conflict_report.py
      - name: Render incremental scenario report and sensitivity chart
        run: python scripts/render_nmd2018_quality_steps.py
      - name: Render landcover plausibility flags and review samples
        run: python scripts/render_biomass_plausibility_review.py
      - name: Create independent-evidence review register
        run: python scripts/create_biomass_review_register.py && python scripts/create_biomass_review_register.py --validate metadata/biomass_independent_review_register.csv
      - name: Create probabilistic stratified sample for independent validation
        run: python scripts/render_biomass_stratified_sample.py
      - name: Export independent review map GeoJSON in original SGD2 grid
        run: python scripts/publish_biomass_review_map.py
      - name: Verify all user observations are mapped without false confirmations
        run: python scripts/test_review_map_export.py
      - name: Publish read-only review snapshot for GitHub Pages
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/biomass_review_snapshot.geojson
          if ! git diff --cached --quiet; then
            git commit -m 'Update reviewed biomass sample map from NMD audit'
            git push origin HEAD:main
          fi
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgd2-nmd2018-lulea-audit
          path: |
            metadata/nmd2018_biomass_lulea_audit.json
            metadata/nmd2018_conflict_report.md
            metadata/nmd2018_conflict_overview.png
            metadata/nmd2018_quality_steps.md
            metadata/nmd2018_quality_steps.png
            metadata/biomass_plausibility_review.md
            metadata/biomass_review_candidates_epsg3006.csv
            metadata/biomass_independent_review_register.csv
            metadata/biomass_stratified_validation_sample_epsg3006.csv
            metadata/biomass_stratified_sample_design.md
            docs/data/biomass_review_snapshot.geojson
          if-no-files-found: warn
          retention-days: 30
