name: Audit SGD2 biomass vs NMD2018 Norrbotten
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster dependencies
        run: pip install -r requirements.txt
      - name: Download verified NMD2018 Norrbotten and cross-tab original SGD2
        run: python scripts/run_nmd2018_lulea_qa.py
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgd2-nmd2018-lulea-audit
          path: metadata/nmd2018_biomass_lulea_audit.json
          if-no-files-found: warn
          retention-days: 30
