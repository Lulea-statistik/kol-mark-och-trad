name: Test forest metadata probe diagnostics
on:
  pull_request:
    paths:
      - 'scripts/probe_growth_raster_metadata.py'
      - 'scripts/test_growth_metadata_probe.py'
      - '.github/workflows/probe-growth-raster-metadata.yml'
      - '.github/workflows/test-growth-metadata-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rasterio
        run: pip install -r requirements.txt
      - name: Compile metadata probe and deterministic test
        run: python -m compileall -q scripts/probe_growth_raster_metadata.py scripts/test_growth_metadata_probe.py
      - name: Verify unavailable source produces failure diagnostics
        run: python scripts/test_growth_metadata_probe.py
