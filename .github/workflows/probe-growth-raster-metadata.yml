name: Verify forest age and site index raster metadata (SLU and SG2)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe_growth_raster_metadata.py'
      - '.github/workflows/probe-growth-raster-metadata.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rasterio dependencies
        run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -m compileall -q scripts/probe_growth_raster_metadata.py
      - name: Inspect native remote TIFF metadata without full download
        run: python scripts/probe_growth_raster_metadata.py --output metadata/forest_growth_remote_raster_probe.json
      - name: Upload source metadata diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-site-age-source-metadata
          path: metadata/forest_growth_remote_raster_probe.json
          if-no-files-found: warn
          retention-days: 90
