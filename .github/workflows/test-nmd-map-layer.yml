name: Validate source-backed NMD map layer
on:
  pull_request:
    paths:
      - 'scripts/publish_nmd_productivity_preview.py'
      - 'scripts/publish_slu_previews.py'
      - 'docs/app.js'
      - 'docs/index.html'
      - '.github/workflows/publish-nmd-productivity.yml'
      - '.github/workflows/test-nmd-map-layer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax and Leaflet source
        run: |
          python -m py_compile scripts/publish_nmd_productivity_preview.py scripts/publish_slu_previews.py
          node --check docs/app.js
      - name: Test with SYNTHETIC test raster (never publish it)
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          import numpy as np
          import rasterio
          from rasterio.transform import from_origin
          from shapely.geometry import shape
          from shapely.ops import transform as shapely_transform
          from pyproj import Transformer
          import subprocess
          data=json.loads(Path('docs/data/lulea_boundary.geojson').read_text(encoding='utf-8'))
          geom=shape(data['features'][0]['geometry'])
          p=geom.representative_point()
          east,north=Transformer.from_crs('EPSG:4326','EPSG:3006',always_xy=True).transform(p.x,p.y)
          with tempfile.TemporaryDirectory() as tmp:
              source=Path(tmp)/'test_nmd.tif'
              with rasterio.open(source,'w',driver='GTiff',width=300,height=300,count=10,
                  dtype='int16',crs='EPSG:3006',
                  transform=from_origin(east-1500,north+1500,10,10),
                  nodata=-9999) as dst:
                  blank=np.full((300,300),-9999,dtype='int16')
                  for i in range(1,10):dst.write(blank,i)
                  classes=np.ones((300,300),dtype='int16')
                  classes[:100,:]=0
                  classes[100:200,:]=2
                  dst.write(classes,10)
              subprocess.run(['python','scripts/publish_nmd_productivity_preview.py',
                '--source',str(source),'--band','10',
                '--version','SYNTHETIC-TEST-NOT-FOR-PUBLICATION',
                '--source-url','https://example.org/synthetic-test.tif'],check=True)
              manifest=json.loads(Path('docs/data/preview/preview_layers.json').read_text(encoding='utf-8'))
              m=manifest['layers']['nmd_productivity']
              assert m['raster_grid_crs']=='EPSG:3857'
              assert m['source_crs']=='EPSG:3006'
              assert m['valid_preview_pixels']>0
              assert sum(m['class_preview_pixel_counts'].values())==m['valid_preview_pixels']
              assert Path('docs/data/preview/nmd_productivitet_preview.png').is_file()
              assert Path('docs/data/preview/nmd_productivitet_sampled_values.f32.gz').is_file()
              print('Synthetic NMD publication passed - no generated file committed')
          PY
