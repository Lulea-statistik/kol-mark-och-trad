name: Compare age-dependent and global biomass calibration from 2000
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/model_age_adjusted_biomass.py'
      - 'docs/age-adjusted-biomass.js'
      - 'docs/data/age_adjusted_biomass_2000_2005.json'
      - 'docs/modelled-biomass-2000.html'
      - 'scripts/archive_historic_forest_age.py'
      - '.github/workflows/age-adjusted-biomass-2000.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster analysis dependencies
        run: pip install -r requirements.txt
      - name: Check source code syntax
        run: |
          python -m compileall -q scripts/model_age_adjusted_biomass.py scripts/analyze_forest_age_2010.py scripts/analyze_historic_volume.py
          python scripts/test_biomass_crs_authority.py
      - name: Verify published JavaScript and analysis JSON
        run: |
          node --check docs/age-adjusted-biomass.js
          python -m json.tool docs/data/age_adjusted_biomass_2000_2005.json > /dev/null
      - name: Download verified source-CRS municipal raster archives
        run: |
          mkdir -p release-volume release-age-history release-age-2010 release-biomass
          gh release download total-wood-volume-lulea-2000-2010-v1 --dir release-volume --pattern 'lulea_total_volume_*'
          gh release download forest-age-lulea-2010-v1 --dir release-age-2010 --pattern 'lulea_forest_age_*'
          gh release download biomass-source-clips-lulea-v1 --dir release-biomass --pattern 'lulea_biomass_*'
      - name: Build historical age clips for PR review without publishing release
        if: github.event_name == 'pull_request'
        run: |
          python scripts/archive_historic_forest_age.py --year 2000 --output-dir release-age-history
          python scripts/archive_historic_forest_age.py --year 2005 --output-dir release-age-history
      - name: Read archived historical age from GitHub Release after merge
        if: github.event_name != 'pull_request'
        run: gh release download forest-age-lulea-2000-2005-v1 --dir release-age-history --pattern 'lulea_forest_age_*'
      - name: Validate all archives and calculate age-adjusted biomass
        run: |
          python scripts/model_age_adjusted_biomass.py \
            --volume-dir release-volume \
            --age-history-dir release-age-history \
            --age-2010-dir release-age-2010 \
            --biomass-dir release-biomass \
            --output metadata/age_adjusted_biomass_2000_2005.json
      - name: Print exploratory results
        if: always()
        run: |
          test ! -s metadata/age_adjusted_biomass_2000_2005.json || cat metadata/age_adjusted_biomass_2000_2005.json
      - name: Archive common-area analysis and source QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: age-adjusted-biomass-2000-2005-diagnostics
          path: |
            metadata/age_adjusted_biomass_2000_2005.json
            metadata/biomass_release_validation.json
          if-no-files-found: warn
          retention-days: 90
