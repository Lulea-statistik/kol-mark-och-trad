name: Compare biomass and 2010 volume by NMD2018 landcover
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/compare_nmd2018_landcover_biomass_volume.py'
      - 'scripts/analyze_2010_biomass_volume_cellwise.py'
      - 'scripts/audit_biomass_source_coverage_2010.py'
      - 'scripts/decompose_harmonize_biomass2010.py'
      - 'scripts/audit_biomass_units_and_mass_gate.py'
      - '.github/workflows/compare-biomass-nmd2018-landcover.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies and syntax check
        run: |
          python -m pip install -r requirements.txt "scipy>=1.11"
          python -m py_compile scripts/compare_nmd2018_landcover_biomass_volume.py scripts/analyze_2010_biomass_volume_cellwise.py scripts/audit_biomass_source_coverage_2010.py scripts/decompose_harmonize_biomass2010.py scripts/audit_biomass_units_and_mass_gate.py
      - name: Fetch archived original CRS biomass and volume clips
        run: |
          mkdir -p release-biomass release-volume
          gh release download biomass-source-clips-lulea-v1 --dir release-biomass --pattern 'lulea_biomass_*'
          gh release download total-wood-volume-lulea-2000-2010-v1 --dir release-volume --pattern 'lulea_total_volume_2010_*'
          for y in 2010 2015 2018; do test -s "release-biomass/lulea_biomass_${y}_source_crs_clip.tif"; done
          test -s release-volume/lulea_total_volume_2010_source_crs_clip.tif
      - name: Verify archived biomass files
        run: python scripts/verify_biomass_release.py --directory release-biomass --output metadata/landcover_source_validation.json
      - name: Download NMD2018 original Norrbotten base landcover (BD county)
        run: |
          mkdir -p nmd-input
          curl --fail --location --retry 3 --retry-delay 10 --connect-timeout 45 \
            --output nmd-input/BD_lan_nmd2018bas_ogeneraliserad_v1_1.zip \
            https://geodata.naturvardsverket.se/nedladdning/marktacke/NMD2018/bas_lan_ogen/BD_lan_nmd2018bas_ogeneraliserad_v1_1.zip
          sha256sum nmd-input/BD_lan_nmd2018bas_ogeneraliserad_v1_1.zip > metadata/nmd2018_landcover_zip_sha256.txt
      - name: Extract and validate NMD original raster
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil,rasterio
          import sys
          sys.path.insert(0,"scripts")
          from fetch_and_compare_biomass_native import matches_expected_crs
          srcpath=Path("nmd-input/BD_lan_nmd2018bas_ogeneraliserad_v1_1.zip")
          with ZipFile(srcpath) as z:
              candidates=[x for x in z.infolist() if x.filename.lower().endswith('.tif') and 'bas' in x.filename.lower()]
              print("GeoTIFF candidates:",[x.filename for x in candidates])
              if len(candidates)!=1:raise ValueError("Expected exactly one NMD base GeoTIFF")
              dst=Path("nmd-input/NMD2018bas_BD.tif")
              with z.open(candidates[0]) as f,dst.open('wb') as out:
                  shutil.copyfileobj(f,out,8*1024*1024)
              # Preserve external world/CRS metadata if the supplied TIFF depends on sidecars.
              for member in z.infolist():
                  if member.is_dir() or member.filename==candidates[0].filename:continue
                  basename=Path(member.filename).name
                  if basename.lower().startswith(Path(candidates[0].filename).stem.lower()+'.') or basename.lower()==Path(candidates[0].filename).with_suffix('.tfw').name.lower():
                      with z.open(member) as inp,(dst.parent/basename).open('wb') as out:
                          shutil.copyfileobj(inp,out)
          with rasterio.open(dst) as raster:
              print("NMD2018 source metadata",{"crs":str(raster.crs),"epsg":raster.crs.to_epsg() if raster.crs else None,
                "resolution":raster.res,"bands":raster.count,"nodata":raster.nodata,
                "transform":str(raster.transform),"bounds":str(raster.bounds)},flush=True)
              if raster.crs is None:raise ValueError("NMD source has no readable CRS; examine original sidecar files")
              if raster.count!=1:raise ValueError(f"Expected one NMD band, got {raster.count}")
              if any(abs(abs(r)-10)>.01 for r in raster.res):
                  raise ValueError(f"Expected 10m source cells, got {raster.res}")
              # A real, complete reprojection to the EPSG:3006 analysis grid is handled
              # by WarpedVRT. Source NMD CRS must be verified, not guessed or overwritten.
              if not matches_expected_crs(raster.crs,3006):
                  raise ValueError(f"Unexpected unverified source CRS: {raster.crs}")
              print("Verified NMD source with explicit CRS",raster.crs,raster.res,raster.nodata,flush=True)
          PY
      - name: Compare biomass by all original NMD2018 landcover classes
        run: |
          python scripts/compare_nmd2018_landcover_biomass_volume.py \
            --biomass-2010 release-biomass/lulea_biomass_2010_source_crs_clip.tif \
            --biomass-2015 release-biomass/lulea_biomass_2015_source_crs_clip.tif \
            --biomass-2018 release-biomass/lulea_biomass_2018_source_crs_clip.tif \
            --volume-2010 release-volume/lulea_total_volume_2010_source_crs_clip.tif \
            --nmd nmd-input/NMD2018bas_BD.tif \
            --output metadata/nmd2018_landcover_biomass_volume.json
      - name: Verify reference population and print summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('metadata/nmd2018_landcover_biomass_volume.json').read_text())
          assert d['analysis_CRS']=='EPSG:3006' and d['resolution_m']==25
          assert d['matched_cells']==2456410, d['matched_cells']
          assert sum(x['cells'] for x in d['class_rows'])==d['matched_cells']
          assert sum(x['cells'] for x in d['group_rows'])==d['matched_cells']
          assert all(x['volume_2010_ge100_cells']<=x['cells'] for x in d['class_rows'])
          forest=d['forest_only_NMD2018_reference']
          assert forest['cells']==sum(x['cells'] for x in d['class_rows'] if x['class_code'] in list(range(111,118))+list(range(121,128)))
          water=d['water_distance_NMD2018']
          assert sum(x['cells'] for x in water)==sum(x['cells'] for x in d['class_rows'] if x['class_code'] in (61,62))
          print('Reference population validated',d['matched_area_ha'])
          print('Forest-only:',forest)
          print('Water distance breakdown:',water)
          sensitivity=d['nmd_nearest_vs_mode_sensitivity']
          groups=sensitivity['overlap_cells_by_water_agreement']
          assert sum(row['cells'] for row in groups.values())<=d['matched_cells']
          assert sensitivity['water_nearest_cells']==sum(x['cells'] for x in d['class_rows'] if x['class_code'] in (61,62))
          assert sensitivity['water_nearest_cells']>=groups['water_both']['cells']+groups['water_nearest_only']['cells']
          assert sensitivity['water_mode_cells']>=groups['water_both']['cells']+groups['water_mode_only']['cells']
          print('NMD nearest versus mode sensitivity:',sensitivity)
          shore=d['nmd2018_riparian_forest_gradient']
          water_side=shore['water_side_distance_to_nonwater']
          forest_side=shore['forest_side_distance_to_water']
          water_to_forest=shore['water_distance_to_NMD2018_forest']
          water_cells=sum(x['cells'] for x in d['class_rows'] if x['class_code'] in (61,62))
          assert sum(x['cells'] for x in water_side.values())==water_cells
          assert sum(x['cells'] for x in water_to_forest.values())==water_cells
          assert sum(x['cells'] for x in forest_side.values())==forest['cells']
          expected_bands=['0-25 m','>25-50 m','>50-75 m','>75-100 m','>100 m']
          assert list(water_side)==expected_bands, list(water_side)
          assert list(forest_side)==expected_bands, list(forest_side)
          assert all(x['cells']>=0 for x in water_side.values())
          assert all(x['cells']>=0 for x in forest_side.values())
          for group in (water_side,forest_side):
              assert all(abs(x['area_ha']-x['cells']*.0625)<1e-8 for x in group.values())
          source=d['original_10m_water_fraction_and_4_8_neighbours']
          groups=source['groups']
          pure=sum(groups[k]['cells'] for k in ('pure_water_four_land_neighbour',
              'pure_water_diagonal_only_land_neighbour','pure_water_no_eight_land_neighbour'))
          assert pure==source['pure_water_25m_cells_common_biomass']
          assert groups['nearest_water_with_pure_water']['cells']<=pure
          assert groups['nearest_water_with_pure_water']['cells']+groups['nearest_water_with_mixed_water']['cells']<=water_cells
          assert groups['pure_water_four_land_neighbour']['cells']+groups['pure_water_diagonal_only_land_neighbour']['cells']<=pure
          assert all(row['area_ha']==row['cells']*.0625 for row in groups.values())
          clusters=d['pure_water_no_eight_land_neighbour_clusters']
          assert clusters['total_cells']==groups['pure_water_no_eight_land_neighbour']['cells']
          assert clusters['largest_component_cells']<=clusters['total_cells']
          assert clusters['components']>=1
          assert sum(x['cells'] for x in clusters['top_components'])<=clusters['total_cells']
          for x in clusters['top_components']:
              assert len(x['bounds_epsg3006'])==4
              assert x['bounds_epsg3006'][0]<x['centroid_easting_epsg3006']<x['bounds_epsg3006'][2]
              assert x['bounds_epsg3006'][1]<x['centroid_northing_epsg3006']<x['bounds_epsg3006'][3]
          print('Pure-water isolated geographic clusters:',clusters)
          print('Native source water cover, four and eight neighbours:',source)
          print('Riparian forest-gradient validated',shore)
          for x in d['group_rows']:print(x)
          PY
      - name: Verify temporary-not-forest 118/128 volume and zero strata
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          d=json.loads(Path('metadata/nmd2018_landcover_biomass_volume.json').read_text())
          t=d['temporary_not_forest_2018_volume_and_zero_diagnostics']
          rows=[r for r in d['class_rows'] if r['class_code'] in (118,128)]
          assert t['cells']==sum(r['cells'] for r in rows)
          bins=t['volume_groups']
          assert sum(b['cells'] for b in bins.values())==t['cells']
          for y in ('2010','2015','2018'):
              target=sum(r['biomass_means_raw'][y]*r['cells'] for r in rows)
              assert math.isclose(sum(b['sums_raw'][y] for b in bins.values()),target,rel_tol=1e-7)
          for b in bins.values():
              assert 0<=b['zero_2015_cells']<=b['cells']
              assert 0<=b['zero_2018_cells']<=b['cells']
              assert 0<=b['zero_both_2015_2018_cells']<=min(b['zero_2015_cells'],b['zero_2018_cells'])
          print('Temporary-not-forest groups verified',json.dumps(t,ensure_ascii=False))
          PY
      - name: Diagnose 2010 biomass-volume relationship per pixel and geographical tile
        run: |
          python scripts/analyze_2010_biomass_volume_cellwise.py \
            --biomass-2010 release-biomass/lulea_biomass_2010_source_crs_clip.tif \
            --biomass-2015 release-biomass/lulea_biomass_2015_source_crs_clip.tif \
            --biomass-2018 release-biomass/lulea_biomass_2018_source_crs_clip.tif \
            --volume-2010 release-volume/lulea_total_volume_2010_source_crs_clip.tif \
            --nmd nmd-input/NMD2018bas_BD.tif \
            --output metadata/biomass_volume_2010_cellwise.json
      - name: Verify 2010 cellwise relation and selection mask
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('metadata/biomass_volume_2010_cellwise.json').read_text())
          ref=json.loads(Path('metadata/nmd2018_landcover_biomass_volume.json').read_text())
          assert d['analysis_CRS']=='EPSG:3006' and d['resolution_m']==25
          assert d['overall']['cells']<=ref['matched_cells']
          assert d['overall']['cells']>2000000
          assert sum(r['cells'] for r in d['nmd_groups'])==d['overall']['cells']
          assert sum(r['cells'] for r in d['nmd_classes'])==d['overall']['cells']
          assert sum(r['cells'] for r in d['geographic_tiles_by_group'])==d['overall']['cells']
          for group in d['nmd_groups']:
              assert group['cells']>0
              assert group['ratio_cell_count_volume_ge10']<=group['cells']
              assert group['ols_r_squared'] is None or 0<=group['ols_r_squared']<=1.000000001
          print('2010 cellwise relationship verified:',d['overall'])
          print('NMD2018 groups:')
          for row in d['nmd_groups']:print(row)
          PY
      - name: Audit the 2010 source effective data masks without later-year selection
        run: |
          python scripts/audit_biomass_source_coverage_2010.py \
            --biomass-2010 release-biomass/lulea_biomass_2010_source_crs_clip.tif \
            --volume-2010 release-volume/lulea_total_volume_2010_source_crs_clip.tif \
            --biomass-2015 release-biomass/lulea_biomass_2015_source_crs_clip.tif \
            --biomass-2018 release-biomass/lulea_biomass_2018_source_crs_clip.tif \
            --nmd nmd-input/NMD2018bas_BD.tif \
            --output metadata/biomass_source_coverage_2010.json
      - name: Verify independent 2010 mask population and shared-population reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('metadata/biomass_source_coverage_2010.json').read_text())
          ref=json.loads(Path('metadata/biomass_volume_2010_cellwise.json').read_text())
          assert d['analysis_crs']=='EPSG:3006' and d['pixel_size_m']==25
          groups=d['group_rows']
          assert set(groups)=={'Water_NMD2018','Forest_NMD2018','Other_NMD2018'}
          assert sum(g['nmd_cells'] for g in groups.values())==d['area']['nmd_valid_cells']
          assert all(g['both_2010_and_later_valid']<=g['both_2010_valid'] for g in groups.values())
          assert sum(g['both_2010_and_later_valid'] for g in groups.values())==ref['overall']['cells']
          expected={'Water_NMD2018':25821,'Forest_NMD2018':1705502,'Other_NMD2018':725087}
          for name,n in expected.items():assert groups[name]['both_2010_and_later_valid']==n,(name,groups[name])
          for g in groups.values():
              assert sum(g.get('pattern_'+format(i,'04b'),0) for i in range(16))==g['nmd_cells']
          print('Source mask audit validated against PR94 shared reference')
          for name,group in sorted(groups.items()):
              print(name,group)
          PY
      - name: Decompose biomass 2010 excess and compute common-area comparable sums
        run: |
          python scripts/decompose_harmonize_biomass2010.py \
            --input metadata/nmd2018_landcover_biomass_volume.json \
            --output metadata/biomass2010_harmonized_comparison.json
      - name: Verify sum conservation and forest-only reference
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, math
          d=json.loads(Path("metadata/biomass2010_harmonized_comparison.json").read_text())
          assert d["status"]=="RAW_UNIT_COMMON_AREA_HARMONIZATION_ONLY_NO_PHYSICAL_UNIT_CORRECTION"
          o=d["comparison_sum_options"]
          a=o["A_common_valid_all_NMD_groups_raw"]
          b=o["B_common_valid_excluding_NMD2018_water_raw"]
          c=o["C_common_valid_NMD2018_forest_only_RAW_RECOMMENDED"]
          assert a["cells"]==2456410 and c["cells"]==1705502
          assert len(d["decomposition_by_fixed_NMD2018_class"])==4
          assert sum(r["cells"] for r in d["decomposition_by_fixed_NMD2018_class"])==a["cells"]
          for y in ("2010","2015","2018"):
              raw=a["raw_sums_pixel_units"][y]
              assert raw>=c["raw_sums_pixel_units"][y]>=0
              assert raw>=b["raw_sums_pixel_units"][y]>=0
              assert math.isclose(raw,sum(z["raw_sums_pixel_units"][y] for z in d["decomposition_by_fixed_NMD2018_class"]),rel_tol=1e-10)
          assert not c["physical_unit_harmonized"]
          assert not d["interpretation"]["can_label_metric_total_municipal_biomass"]
          print("RAW comparison sum reconciled. Physical unit harmonization remains UNVERIFIED.")
          PY
      - name: Audit documented biomass units and guard physical mass conversion
        run: |
          python scripts/audit_biomass_units_and_mass_gate.py \
            --input metadata/biomass2010_harmonized_comparison.json \
            --output metadata/biomass_unit_mass_gate.json
      - name: Validate source-confirmed 2010 tonnes and protect model comparability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("metadata/biomass_unit_mass_gate.json").read_text())
          assert d["status"]=="PHYSICAL_MASS_2010_CONVERSION_SOURCE_CONFIRMED_TEMPORAL_COMPARABILITY_NOT_VERIFIED"
          a=d["candidate_mass_by_common_mask"]
          assert len(a)==3
          for name,part in a.items():
              values=part["per_year"]
              assert values["2010"]["tonnes_dry_matter"]>0
              assert values["2010"]["same_component_and_model_as_other_years_verified"] is False
              assert values["2010"]["physical_conversion_status"].startswith("SOURCE_PRODUCER_CONFIRMED_2010_UNIT")
              assert values["2015"]["tonnes_dry_matter"]>0
              assert values["2018"]["tonnes_dry_matter"]>0
          print("2010 source-confirmed tonnes calculated; cross-model comparability remains UNVERIFIED")
          PY
      - name: Archive landcover and biomass results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmd2018-landcover-biomass-volume-diagnostics
          path: |
            metadata/nmd2018_landcover_biomass_volume.json
            metadata/biomass_volume_2010_cellwise.json
            metadata/biomass_source_coverage_2010.json
            metadata/biomass2010_harmonized_comparison.json
            metadata/biomass_unit_mass_gate.json
            metadata/landcover_source_validation.json
            metadata/nmd2018_landcover_zip_sha256.txt
          if-no-files-found: warn
          retention-days: 90
