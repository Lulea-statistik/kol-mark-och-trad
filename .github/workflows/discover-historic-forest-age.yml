name: Discover historic forest age and biomass 2000-2005
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/discover_historic_forest_age.py'
      - '.github/workflows/discover-historic-forest-age.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster metadata tools
        run: pip install -r requirements.txt
      - name: Check source syntax
        run: python -m compileall -q scripts/discover_historic_forest_age.py
      - name: Query SLU directories and verify source raster metadata
        run: python scripts/discover_historic_forest_age.py
      - name: Preserve source listing and raster diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historic-age-and-biomass-discovery
          path: metadata/historical_forest_raster_discovery.json
          if-no-files-found: warn
          retention-days: 90
