name: Diagnose elevated 2010 biomass against age volume and coverage
on:
  pull_request:
    paths:
      - 'scripts/diagnose_2010_biomass_excess.py'
      - 'docs/biomass-2010-excess.js'
      - 'docs/data/biomass_2010_excess_diagnostics.json'
      - 'docs/biomass-trend.html'
      - '.github/workflows/diagnose-2010-biomass-excess.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster dependencies
        run: pip install -r requirements.txt
      - name: Check analysis script syntax
        run: python -m compileall -q scripts/diagnose_2010_biomass_excess.py
      - name: Validate diagnostic website and published JSON
        run: |
          node --check docs/biomass-2010-excess.js
          python - <<'PY'
          import json
          from pathlib import Path
          from html.parser import HTMLParser
          d=json.loads(Path('docs/data/biomass_2010_excess_diagnostics.json').read_text())
          assert d['status']=='DESCRIPTIVE_2010_EXCESS_DIAGNOSTICS_NOT_HARMONIZED'
          assert d['analysis_crs']=='EPSG:3006' and d['cell_size_m']==25
          assert d['joint_valid_with_2010_age_volume']['cells']>0
          for y in ('2010','2015','2018'):
           assert d['paired_biomass_only'][y]['paired_n']>0
          doc=Path('docs/biomass-trend.html').read_text()
          for htmlid in ('biomass2010ExcessStatus','biomass2010AgeChart','biomass2010CoverageTable','biomass2010AgeTable','biomass2010VolumeTable'):
           assert doc.count('id="'+htmlid+'"')==1,htmlid
          assert '<script src="biomass-2010-excess.js"></script>' in doc
          print('PASS: webpage and area/age/volume diagnostic JSON')
          PY
      - name: Download verified raster archive excerpts
        run: |
          mkdir -p release-biomass release-volume release-age
          gh release download biomass-source-clips-lulea-v1 --dir release-biomass --pattern 'lulea_biomass_*'
          gh release download total-wood-volume-lulea-2000-2010-v1 --dir release-volume --pattern 'lulea_total_volume_*'
          gh release download forest-age-lulea-2010-v1 --dir release-age --pattern 'lulea_forest_age_2010_*'
      - name: Diagnose 2010 mean biomass and matched age volume strata
        run: python scripts/diagnose_2010_biomass_excess.py --output metadata/biomass_2010_excess_diagnostics.json
      - name: Archive diagnostic result and source archive integrity checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomass-2010-excess-coverage-age-volume-diagnostics
          path: |
            metadata/biomass_2010_excess_diagnostics.json
            metadata/diagnostic_biomass_archive_qa.json
          if-no-files-found: warn
          retention-days: 90
