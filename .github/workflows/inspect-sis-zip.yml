name: Verify source SIS ZIP metadata inspection
on:
  pull_request:
    paths:
      - 'scripts/inspect_sis_zip.py'
      - '.github/workflows/inspect-sis-zip.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_sis_zip.py'
      - '.github/workflows/inspect-sis-zip.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rasterio
      - name: Test archive inspection with synthetic EPSG3006 TIFFs
        run: |
          python -m py_compile scripts/inspect_sis_zip.py
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys,zipfile,json,tempfile
          import numpy as np
          import rasterio
          from rasterio.transform import from_origin
          with tempfile.TemporaryDirectory() as tmp:
              d=Path(tmp)
              for kind in ('pine','spruce'):
                  tif=d/(kind+'.tif')
                  with rasterio.open(tif,'w',driver='GTiff',width=3,height=3,count=1,
                      dtype='float32',crs='EPSG:3006',transform=from_origin(500000,7300000,25,25),
                      nodata=-9999) as dst:
                      dst.write(np.full((3,3),20,dtype='float32'),1)
                  with zipfile.ZipFile(d/(kind+'.zip'),'w') as z:z.write(tif,arcname=tif.name)
              out=d/'inspection.json'
              cmd=[sys.executable,'scripts/inspect_sis_zip.py','--pine-zip',str(d/'pine.zip'),
                   '--spruce-zip',str(d/'spruce.zip'),'--output',str(out)]
              subprocess.run(cmd,check=True)
              v=json.loads(out.read_text())
              assert v['status']=='SOURCE_RASTER_ARCHIVES_METADATA_ONLY_NOT_BONITET'
              for kind in ('pine','spruce'):
                  assert v[kind]['rasters'][0]['epsg']==3006
                  assert v[kind]['rasters'][0]['resolution']==[25.0,25.0]
              bad=d/'bad.zip'
              with zipfile.ZipFile(bad,'w') as z:z.writestr('../bad.tif','bad')
              res=subprocess.run([x if x!=str(d/'pine.zip') else str(bad) for x in cmd],capture_output=True,text=True)
              assert res.returncode!=0 and 'Unsafe archive entry' in res.stderr
              print('SIS_ZIP_METADATA_AND_SAFETY_OK')
          PY
