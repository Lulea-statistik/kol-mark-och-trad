name: Audit original biomass raster values
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Inspect 2010 2015 2018 native windows and extreme values
        run: python scripts/audit_biomass_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biomass-native-raster-audit
          path: metadata/biomass_native_audit.json
          if-no-files-found: warn
          retention-days: 30
